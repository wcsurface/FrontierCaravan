<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Encore: Concert & Setlist Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background-color: #121212; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px; }

    /* Header */
    #header { width: 100%; max-width: 420px; display: flex; justify-between: align-items: center; padding-bottom: 12px; }
    .title { font-weight: 900; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; }

    /* Ticket Card */
    .ticket { position: relative; width: 100%; max-width: 420px; background: #f3ebd7; color: #0f172a; border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; justify-between: align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: pointer; border-right: 2px dashed #d1c29e; }
    .ticket-artist { font-weight: 900; font-size: 20px; text-transform: uppercase; }
    .ticket-venue { font-weight: 600; font-size: 12px; color: #475569; }
    .ticket-date { background: #ffb300; color: #0a0a0a; font-weight: 800; font-size: 11px; padding: 3px 8px; border-radius: 6px; margin-top: 6px; display: inline-block; }

    /* Action CTA */
    .btn-cta { width: 100%; max-width: 420px; background: #00E676; color: #0a0a0a; font-weight: 900; font-size: 13px; padding: 14px; border-radius: 16px; border: none; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 20px rgba(0,230,118,0.4); }
  </style>
</head>
<body>

  <div id="header">
    <div style="color:#00E676; font-size:20px;">☰</div>
    <div class="title">DIARY</div>
    <div style="color:#00E676; font-size:20px;">★</div>
  </div>

  <div style="flex:1; width:100%; max-width:420px; overflow-y:auto;">
    <div class="ticket">
      <div>
        <div class="ticket-artist">THE CURE</div>
        <div class="ticket-venue">Red Rocks</div>
        <div class="ticket-date">OCT 12, 2026</div>
      </div>
      <div style="background:#00E676; width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#0a0a0a; font-size:12px;">♥</div>
    </div>

    <div class="ticket">
      <div>
        <div class="ticket-artist">PIXIES</div>
        <div class="ticket-venue">The Fillmore</div>
        <div class="ticket-date">OCT 12, 2026</div>
      </div>
      <div style="background:#00E676; width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#0a0a0a; font-size:12px;">♥</div>
    </div>
  </div>

  <button class="btn-cta">+ LOG NEW SHOW</button>

</body>
</html>
