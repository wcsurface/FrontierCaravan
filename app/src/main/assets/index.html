<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Midnight Mart: Neon Bodega</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background-color: #070112; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px; }

    /* Top HUD Header */
    #hud { width: 100%; max-width: 420px; background: rgba(15, 9, 31, 0.8); border: 1px solid rgba(147, 51, 234, 0.4); border-radius: 16px; padding: 8px 16px; display: flex; justify-between: align-items: center; z-index: 10; }
    .hud-stat { font-weight: 800; font-size: 13px; color: #f43f5e; display: flex; align-items: center; gap: 4px; }
    .hud-badge { background: rgba(88, 28, 135, 0.5); padding: 3px 10px; border-radius: 8px; border: 1px solid rgba(126, 34, 206, 0.4); font-size: 11px; font-weight: 700; color: #e9d5ff; }

    /* Canvas Container */
    #canvas-container { relative: width: 100%; max-width: 420px; height: 480px; display: flex; justify-content: center; align-items: center; }
    canvas { width: 100%; height: 100%; border-radius: 20px; border: 1px solid rgba(147, 51, 234, 0.3); background: #0f091f; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }

    /* Bottom Navigation Dock */
    #nav-bar { width: 100%; max-width: 420px; background: rgba(15, 9, 31, 0.9); border: 1px solid rgba(147, 51, 234, 0.4); border-radius: 24px; padding: 8px; display: flex; justify-around: align-items: center; }
    .nav-btn { background: none; border: none; color: #ec4899; font-weight: 900; font-size: 11px; letter-spacing: 1px; padding: 6px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-stat">❤️ <span id="stat-lives">5</span></div>
    <div class="hud-badge">Moves: <span id="stat-moves">12</span></div>
    <div class="hud-badge" style="border-color:rgba(6,182,212,0.4); color:#a5f3fc;">Coins: 💰 <span id="stat-coins">250</span></div>
  </div>

  <!-- Canvas Game Viewport -->
  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- Bottom Navigation -->
  <div id="nav-bar">
    <button class="nav-btn">✦ MIDNIGHT MART PWA ✦</button>
  </div>

  <script>
    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPop() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(780, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function playSnap(combo) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      const baseFreq = 440 * Math.pow(2, Math.min(combo, 12) / 12);
      osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    }

    // Native Haptics Bridge
    const haptics = {
      light: () => window.AndroidHaptics ? window.AndroidHaptics.vibrateLight() : (navigator.vibrate && navigator.vibrate(10)),
      medium: () => window.AndroidHaptics ? window.AndroidHaptics.vibrateMedium() : (navigator.vibrate && navigator.vibrate(25)),
      heavy: () => window.AndroidHaptics ? window.AndroidHaptics.vibrateHeavy() : (navigator.vibrate && navigator.vibrate([40,30,60])),
      reject: () => window.AndroidHaptics ? window.AndroidHaptics.vibrateReject() : (navigator.vibrate && navigator.vibrate([20,50,20]))
    };

    // Canvas & Game Loop
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = canvas.parentElement.clientWidth || 380;
      height = canvas.height = canvas.parentElement.clientHeight || 480;
    }
    resize();

    // 4x4 Grid State
    const grid = Array.from({ length: 4 }, () => Array(4).fill(0));
    let moves = 12;
    let coins = 250;
    let combo = 0;

    const items = [
      { name: 'Bento', color: '#ff7043', shape: [[0,0],[0,1],[1,0],[1,1]], w:2, h:2 },
      { name: 'Soda', color: '#00ffa3', shape: [[0,0],[1,0]], w:1, h:2 },
      { name: 'Gummy', color: '#ff2a85', shape: [[0,0]], w:1, h:1 }
    ];
    let stagedIndex = 0;

    const CELL = 60;
    const ORIGIN_X = (width - 4 * CELL) / 2 || 35;
    const ORIGIN_Y = 80;

    function render() {
      ctx.fillStyle = '#0f091f';
      ctx.fillRect(0, 0, width, height);

      // Basket Backdrop
      ctx.fillStyle = '#160829';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.strokeRect(ORIGIN_X - 10, ORIGIN_Y - 10, 4 * CELL + 20, 4 * CELL + 20);
      ctx.fillRect(ORIGIN_X - 10, ORIGIN_Y - 10, 4 * CELL + 20, 4 * CELL + 20);

      // Grid Cells
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const x = ORIGIN_X + c * CELL;
          const y = ORIGIN_Y + r * CELL;
          ctx.fillStyle = grid[r][c] ? '#ff2a85' : 'rgba(255,255,255,0.05)';
          ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
          ctx.strokeStyle = 'rgba(255,255,255,0.15)';
          ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4);
        }
      }

      // Render Staged Item Below
      const staged = items[stagedIndex];
      if (staged) {
        ctx.fillStyle = staged.color;
        const sx = width / 2 - (staged.w * CELL) / 2;
        const sy = ORIGIN_Y + 4 * CELL + 40;
        staged.shape.forEach(([dr, dc]) => {
          ctx.fillRect(sx + dc * CELL + 2, sy + dr * CELL + 2, CELL - 4, CELL - 4);
        });
      }

      requestAnimationFrame(render);
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;

      const col = Math.floor((px - ORIGIN_X) / CELL);
      const row = Math.floor((py - ORIGIN_Y) / CELL);

      const staged = items[stagedIndex];
      if (staged && row >= 0 && row < 4 && col >= 0 && col < 4) {
        let valid = true;
        staged.shape.forEach(([dr, dc]) => {
          const r = row + dr, c = col + dc;
          if (r < 0 || r >= 4 || c < 0 || c >= 4 || grid[r][c] !== 0) valid = false;
        });

        if (valid) {
          staged.shape.forEach(([dr, dc]) => { grid[row + dr][col + dc] = 1; });
          combo++;
          moves--;
          coins += 15;
          stagedIndex = (stagedIndex + 1) % items.length;
          document.getElementById('stat-moves').innerText = moves;
          document.getElementById('stat-coins').innerText = coins;
          playSnap(combo);
          haptic.medium();
        } else {
          combo = 0;
          haptic.reject();
        }
      }
    });

    render();
  </script>
</body>
</html>
