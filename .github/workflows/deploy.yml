name: LiveLore CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android APK Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: livelore-apks
          path: app/build/outputs/apk/

  verify-frontend:
    name: Verify & Build Frontend Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-web/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend-web
          npm ci || npm install

      - name: Build Next.js App
        run: |
          cd frontend-web
          npm run build

  verify-backend:
    name: Verify Backend Microservice (Railway)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Backend Service
        run: |
          cd backend-api
          npm ci || npm install
          npm run build
